<!DOCTYPE html>
<html>
    <head>
        <title>Alegoria - Oriented image</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../data/logoAlegoria.jpg">
        <style>
            html,
            body,
            #viewerDiv {
                height: 100%;
                margin: 0;
                overflow: hidden;
                width: 100%;
            }

            #viewerDiv canvas {
                display: block;
            }

            #controlPanel {
                background: rgba(22, 26, 31, 0.94);
                border: 1px solid rgba(255, 255, 255, 0.18);
                color: #f4f7fb;
                font: 13px Arial, Helvetica, sans-serif;
                left: 12px;
                max-width: 310px;
                padding: 10px;
                position: absolute;
                top: 12px;
                z-index: 2000;
            }

            #controlPanel label {
                display: block;
                margin-top: 8px;
            }

            #controlPanel select,
            #controlPanel input,
            #controlPanel button {
                box-sizing: border-box;
                font: inherit;
                margin-top: 4px;
                width: 100%;
            }

            #controlPanel button {
                cursor: pointer;
                padding: 6px 8px;
            }

            #viewerStatus {
                color: #dce7f5;
                margin-top: 8px;
                min-height: 18px;
            }

            #viewerStatus.error,
            .status-error {
                color: #ffb3b3;
            }

            #statusLog {
                border-top: 1px solid rgba(255, 255, 255, 0.14);
                margin-top: 8px;
                max-height: 90px;
                overflow: auto;
                padding-top: 6px;
            }

            .status-line,
            .status-error {
                font-size: 11px;
                line-height: 1.35;
            }

            #credits {
                border-top: 1px solid rgba(255, 255, 255, 0.14);
                margin-top: 8px;
                padding-top: 6px;
            }

            #logoAgape {
                display: block;
                height: 40px;
                margin-bottom: 4px;
                width: auto;
            }

            #credits a {
                color: #dce7f5;
                font-size: 11px;
            }
        </style>
        <script src="config/sites.js?v=20260630-lyon-bdtopo"></script>
    </head>
    <body>
        <div id="viewerDiv"></div>
        <div id="controlPanel">
            <strong>Oriented Image</strong>
            <div id="currentImage">Loading...</div>

            <label>
                Image
                <select id="imageSelect"></select>
            </label>

            <label>
                Distance
                <input id="distanceInput" type="number" min="10" max="10000" step="10" value="200">
            </label>

            <label>
                Opacity
                <input id="opacityInput" type="range" min="0" max="1" step="0.05" value="1">
            </label>

            <label>
                Photo on buildings
                <input id="projectionOpacityInput" type="range" min="0" max="1" step="0.05" value="1">
            </label>

            <label>
                <input id="frustumToggle" type="checkbox" checked>
                Show frustum
            </label>

            <label>
                <input id="borderFadeToggle" type="checkbox" checked>
                Fade image edges
            </label>

            <button id="focusButton" type="button">Focus image</button>
            <button id="nextButton" type="button">Next image</button>

            <div id="viewerStatus"></div>
            <div id="statusLog"></div>

            <div id="credits">
                <img id="logoAgape" src="assets/logo_AGAPE-white.png" alt="AGAPE">
                <a href="http://www.archives-nationales.culture.gouv.fr/" target="_blank">Images: Archives Nationales</a>
            </div>
        </div>

        <script src="../vendor/itowns/itowns.umd.js"></script>
        <script src="projective_texture_material.js?v=20260908-shading"></script>
        <script src="latest_itowns_viewer.js?v=20260908-shading"></script>
        <script>
            AlegoriaLatestViewer.init({
                pageName: 'oriented_images',
                autoFocus: true
            });
        </script>
    </body>
</html>
