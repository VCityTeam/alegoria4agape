<!DOCTYPE html>
<html>
    <head>
        <title>Alegoria - Globe</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../data/logoAlegoria.jpg">
        <style>
            html,
            body,
            #viewerDiv {
                height: 100%;
                margin: 0;
                overflow: hidden;
                width: 100%;
            }

            #viewerDiv canvas {
                display: block;
            }

            #miniDiv {
                background: rgba(22, 26, 31, 0.9);
                bottom: 12px;
                max-height: 45vh;
                max-width: 36vw;
                overflow: auto;
                position: absolute;
                right: 12px;
                z-index: 1800;
            }

            #miniDiv img {
                display: block;
                max-height: 45vh;
                max-width: 36vw;
            }

            #controlPanel {
                background: rgba(22, 26, 31, 0.94);
                border: 1px solid rgba(255, 255, 255, 0.18);
                color: #f4f7fb;
                font: 13px Arial, Helvetica, sans-serif;
                left: 12px;
                max-width: 310px;
                padding: 10px;
                position: absolute;
                top: 12px;
                z-index: 2000;
            }

            #controlPanel label {
                display: block;
                margin-top: 8px;
            }

            #controlPanel select,
            #controlPanel input,
            #controlPanel button {
                box-sizing: border-box;
                font: inherit;
                margin-top: 4px;
                width: 100%;
            }

            #controlPanel button {
                cursor: pointer;
                padding: 6px 8px;
            }

            #pickStatus,
            #countPoints {
                color: #dce7f5;
                display: block;
                margin-top: 8px;
            }

            #viewerStatus {
                color: #dce7f5;
                margin-top: 8px;
                min-height: 18px;
            }

            #viewerStatus.error,
            .status-error {
                color: #ffb3b3;
            }

            #statusLog {
                border-top: 1px solid rgba(255, 255, 255, 0.14);
                margin-top: 8px;
                max-height: 90px;
                overflow: auto;
                padding-top: 6px;
            }

            .status-line,
            .status-error {
                font-size: 11px;
                line-height: 1.35;
            }

            #credits {
                border-top: 1px solid rgba(255, 255, 255, 0.14);
                margin-top: 8px;
                padding-top: 6px;
            }

            #logoAgape {
                display: block;
                height: 40px;
                margin-bottom: 4px;
                width: auto;
            }

            #credits a {
                color: #dce7f5;
                font-size: 11px;
            }
        </style>
        <script src="config/sites.js?v=20260630-lyon-bdtopo"></script>
    </head>
    <body>
        <div id="viewerDiv"></div>
        <div id="miniDiv">
            <img id="img" alt="" src="">
        </div>
        <div id="controlPanel">
            <strong>Globe</strong>
            <div id="currentImage">Loading...</div>

            <label>
                Registered image
                <select id="imageSelect"></select>
            </label>

            <form id="uploadForm" enctype="multipart/form-data">
                <label>
                    Upload image
                    <input id="uploadInput" type="file" name="files[]" accept="image/*" multiple>
                </label>
                <button id="uploadButton" type="submit">Upload File</button>
            </form>

            <label>
                Preview distance
                <input id="distanceInput" type="number" min="10" max="10000" step="10" value="200">
            </label>

            <label>
                Preview opacity
                <input id="opacityInput" type="range" min="0" max="1" step="0.05" value="0.85">
            </label>

            <label>
                Photo on buildings
                <input id="projectionOpacityInput" type="range" min="0" max="1" step="0.05" value="1">
            </label>

            <label>
                <input id="frustumToggle" type="checkbox" checked>
                Show frustum
            </label>

            <label>
                <input id="borderFadeToggle" type="checkbox" checked>
                Fade image edges
            </label>

            <button id="focusButton" type="button">Focus image</button>
            <button id="resetButton" type="button">Reset globe</button>
            <button id="nextButton" type="button">Next image</button>
            <span id="pickStatus">Alt+click 3D point, Shift+click image point</span>
            <span id="countPoints">Points registered: 0</span>
            <button id="undoLastPoint" type="button" disabled>Undo point</button>
            <button id="computeResectionButton" type="button">Go</button>

            <div id="viewerStatus"></div>
            <div id="statusLog"></div>

            <div id="credits">
                <img id="logoAgape" src="assets/logo_AGAPE-white.png" alt="AGAPE">
                <a href="http://www.archives-nationales.culture.gouv.fr/" target="_blank">Images: Archives Nationales</a>
            </div>
        </div>

        <script src="../vendor/itowns/itowns.umd.js"></script>
        <script src="projective_texture_material.js?v=20260908-shading"></script>
        <script src="scene2d.js"></script>
        <script src="scene3dv2.js"></script>
        <script src="createCalibrationFile.js"></script>
        <script src="createMicmacChantierDescripteur.js"></script>
        <script src="latest_itowns_viewer.js?v=20260908-shading"></script>
        <script>
            AlegoriaLatestViewer.init({
                pageName: 'globe',
                autoFocus: false
            });
        </script>
    </body>
</html>
